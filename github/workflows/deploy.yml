# ============================================================
# 牛肉 BEEF · 一条流水线拆成两个产物
#
#   前端 → EdgeOne Makers：纯静态，不含任何后端代码与密钥
#   后端 → 腾讯云 SCF 云函数：密钥全部来自 GitHub Secrets
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   Secrets:
#     EDGEONE_API_TOKEN        EdgeOne Makers 的 API Token
#     TENCENTCLOUD_SECRET_ID   腾讯云 CAM 子账号 SecretId
#     TENCENTCLOUD_SECRET_KEY  腾讯云 CAM 子账号 SecretKey
#     BEEF_ADMIN_PASSWORD      管理员密码（只进云函数，不进前端）
#     ADMIN_TOKEN_SECRET       登录凭证签名密钥
#   Variables（非敏感，可公开）:
#     EDGEONE_PROJECT          EdgeOne 项目名称
#     BEEF_DOMAIN / BEEF_QQ / BEEF_SERVER_ADDR / BEEF_SERVER_PORT
#     BEEF_API_BASE            后端 API 网关地址，例如 https://service-xxx.gz.apigw.tencentcs.com/release/api
#     SCF_REGION / SCF_FUNCTION_NAME / COS_BUCKET / COS_REGION / CORS_ORIGIN
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------
  # 1) 前端：生成 env.js → 组装纯前端产物 → 推送到 EdgeOne
  # ------------------------------------------------------------
  frontend:
    name: 前端 → EdgeOne（纯前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 assets/js/env.js
        run: node scripts/generate-env.mjs
        env:
          BEEF_DOMAIN: ${{ vars.BEEF_DOMAIN }}
          BEEF_BRAND: ${{ vars.BEEF_BRAND }}
          BEEF_BRAND_EN: ${{ vars.BEEF_BRAND_EN }}
          BEEF_QQ: ${{ vars.BEEF_QQ }}
          BEEF_SERVER_ADDR: ${{ vars.BEEF_SERVER_ADDR }}
          BEEF_SERVER_PORT: ${{ vars.BEEF_SERVER_PORT }}
          BEEF_SERVER_ONLINE: ${{ vars.BEEF_SERVER_ONLINE }}
          BEEF_BETA_MODE: ${{ vars.BEEF_BETA_MODE }}
          BEEF_APK_URL: ${{ vars.BEEF_APK_URL }}
          BEEF_APK_VERSION: ${{ vars.BEEF_APK_VERSION }}
          BEEF_REPO_URL: ${{ vars.BEEF_REPO_URL }}
          BEEF_SPONSOR_QR: ${{ vars.BEEF_SPONSOR_QR }}
          # 指向独立后端（SCF 的 API 网关地址）
          BEEF_API_BASE: ${{ vars.BEEF_API_BASE }}
          # 管理员密码不进前端：默认 none，只保留服务端校验
          BEEF_ADMIN_PASSWORD_MODE: none

      - name: 组装纯前端产物 dist/
        run: |
          mkdir -p dist
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'backend/' \
            --exclude 'cloud-functions/' \
            --exclude 'node_modules/' \
            --exclude '.data/' \
            --exclude 'dist/' \
            --exclude 'scripts/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.md' \
            --exclude 'edgeone.json' \
            --exclude 'web.config' \
            --exclude 'netlify.toml' \
            ./ dist/
          test -f dist/index.html
          echo "产物文件数：$(find dist -type f | wc -l)"

      - name: 产物安全检查（不含后端、不含密钥）
        run: |
          set -e
          [ ! -e dist/backend ] || { echo "产物里出现了 backend/"; exit 1; }
          [ ! -e dist/cloud-functions ] || { echo "产物里出现了 cloud-functions/"; exit 1; }
          if grep -RIl -e 'TENCENTCLOUD_SECRET' -e 'ADMIN_TOKEN_SECRET' -e 'BEEF_ADMIN_PASSWORD=' dist/ 2>/dev/null; then
            echo "产物里出现了密钥相关内容"; exit 1
          fi
          echo "安全检查通过"

      - name: 部署到 EdgeOne Makers
        run: |
          npx --yes edgeone@latest makers deploy ./dist \
            -n "$EDGEONE_PROJECT" \
            -t "$EDGEONE_API_TOKEN" \
            -e production
        env:
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

  # ------------------------------------------------------------
  # 2) 后端：打包 → 部署到腾讯云 SCF → 注入环境变量
  # ------------------------------------------------------------
  backend:
    name: 后端 → 腾讯云 SCF
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装后端依赖
        run: npm ci --omit=dev
        working-directory: backend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装腾讯云 CLI
        run: pip install --quiet tccli

      - name: 部署到 SCF
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          SCF_REGION: ${{ vars.SCF_REGION }}
          SCF_FUNCTION_NAME: ${{ vars.SCF_FUNCTION_NAME }}
          # 以下进入云函数的环境变量（前端拿不到）
          BEEF_ADMIN_PASSWORD: ${{ secrets.BEEF_ADMIN_PASSWORD }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_KEY: ${{ vars.COS_KEY }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          BEEF_DOMAIN: ${{ vars.BEEF_DOMAIN }}
          BEEF_QQ: ${{ vars.BEEF_QQ }}
          BEEF_SERVER_ADDR: ${{ vars.BEEF_SERVER_ADDR }}
          BEEF_SERVER_PORT: ${{ vars.BEEF_SERVER_PORT }}
        run: bash scripts/deploy-scf.sh
