<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a6c"/>
      <stop offset="0.55" stop-color="#e8542f"/>
      <stop offset="1" stop-color="#a32b0f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#shine)"/>

  <!-- ears -->
  <ellipse cx="28" cy="52" rx="13" ry="9" fill="#fff8f2" transform="rotate(-24 28 52)"/>
  <ellipse cx="100" cy="52" rx="13" ry="9" fill="#fff8f2" transform="rotate(24 100 52)"/>

  <!-- head -->
  <ellipse cx="64" cy="72" rx="36" ry="32" fill="#fffdf9"/>
  <!-- cow spot -->
  <path d="M40 56c8-9 18-10 24-4-6 8-16 12-26 8z" fill="#4a2113" opacity="0.9"/>
  <path d="M92 88c-6 5-14 6-19 3 4-5 10-8 17-7z" fill="#4a2113" opacity="0.25"/>

  <!-- eyes -->
  <circle cx="52" cy="66" r="5.5" fill="#3a1a10"/>
  <circle cx="78" cy="66" r="5.5" fill="#3a1a10"/>
  <circle cx="53.6" cy="64.4" r="1.7" fill="#ffffff"/>
  <circle cx="79.6" cy="64.4" r="1.7" fill="#ffffff"/>

  <!-- snout -->
  <ellipse cx="64" cy="86" rx="21" ry="14" fill="#ffcfc2"/>
  <ellipse cx="56" cy="86" rx="4" ry="5.4" fill="#c9634e"/>
  <ellipse cx="72" cy="86" rx="4" ry="5.4" fill="#c9634e"/>
</svg>
