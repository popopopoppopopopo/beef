############################################
# 牛肉 BEEF · Netlify 部署配置
# 无需构建命令，直接发布整个目录
############################################

[build]
  publish = "."
  command = ""

# 安全与缓存响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 运行时配置禁止缓存，保证改环境变量后立即生效
[[headers]]
  for = "/assets/js/env.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# 404（本站为单页 + 锚点导航，不需要 SPA 回退；
# 若以后拆成多页，可再加 [[redirects]] from="/*" to="/index.html" status=200）
[[redirects]]
  from = "/admin"
  to = "/index.html#announcements"
  status = 301
